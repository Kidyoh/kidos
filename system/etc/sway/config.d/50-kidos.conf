# KidOS desktop defaults. Updated by `kidos update` — put your own tweaks in ~/.config/sway/config.

bindsym Mod4+Mod1+space exec kidos-menu
bindsym Mod4+a          exec foot --app-id=kidos-float -e kidos ask
bindsym Mod4+slash      exec kidos-welcome --window
bindsym Mod4+Ctrl+v     exec kidos-menu clipboard
bindsym Mod4+n          exec kidos-menu nightlight

# screenshots (saved to ~/Pictures/Screenshots + clipboard). Super+Shift+S is also
# Windows' own snip shortcut, so inside a VM use Print / Super+P instead.
bindsym Mod4+Shift+s    exec kidos-screenshot region
bindsym Mod4+p          exec kidos-screenshot region
bindsym Print           exec kidos-screenshot full
bindsym Mod4+Print      exec kidos-screenshot window

for_window [app_id="kidos-welcome"] floating enable, resize set 780 640
for_window [app_id="kidos-float"]   floating enable, resize set 900 600

exec wl-paste --watch cliphist store
exec kidos-menu nightlight --restore
exec kidos-welcome --first-run
